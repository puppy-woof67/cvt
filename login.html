<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <main class="login-page">
        <div class="login">
                    <form class="login__form" action="#" method="post">
                        <h1 class="login__title">Вход</h1>
                        <input class="login__input" type="text" name="login" placeholder="Логин">
                        <input class="login__input" type="password" name="password" placeholder="Пароль">
                        <label class="login__remember">
                            <input class="login__remember__checkbox" type="checkbox" name="remember">
                            <span class="login__remember__checkbox__text">Запомнить</span>
                        </label>
                        <button class="login__button" type="submit"><span class="login__button__text">Войти</span></button>
                    </form>
        </div>
    </main>
</body>
</html>
